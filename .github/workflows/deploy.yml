name: Deploy Roll to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Test and build game
        run: |
          npm ci --omit=optional
          npm test
          npm run build

      - name: Validate destination
        env:
          ROLL_DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/roll' }}
        run: node --input-type=module -e 'import { validateDeployPath } from "./scripts/deploy-remote.mjs"; validateDeployPath(process.env.ROLL_DEPLOY_PATH)'

      - name: Upload complete build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "dist/*"
          target: ${{ secrets.DEPLOY_PATH || '/var/www/roll' }}
          strip_components: 1
          overwrite: true
          rm: false

      - name: Configure and reload web server
        uses: appleboy/ssh-action@v1.2.0
        env:
          ROLL_DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/roll' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: ROLL_DEPLOY_PATH
          script: |
            set -e
            case "$ROLL_DEPLOY_PATH" in
              /*/*) ;;
              *) echo 'DEPLOY_PATH must be an absolute site directory'; exit 1 ;;
            esac
            case "$ROLL_DEPLOY_PATH" in
              *[!a-zA-Z0-9_./-]*|*/../*|*/./*|*/..|*/.|*//*|*/) echo 'Invalid DEPLOY_PATH'; exit 1 ;;
            esac
            test -f "$ROLL_DEPLOY_PATH/index.html"
            if ! command -v nginx >/dev/null 2>&1; then
              echo 'Nginx is not installed. Run the documented server setup first.' >&2
              exit 1
            fi
            cat > /etc/nginx/conf.d/roll.conf <<EOF_NGINX
            server {
                listen 8000;
                server_name _;
                root $ROLL_DEPLOY_PATH;
                index index.html;
                add_header Cache-Control "no-cache" always;
                add_header X-Content-Type-Options "nosniff" always;
                etag on;
                location ~* \.mjs\$ {
                    types { application/javascript mjs; }
                    default_type application/javascript;
                    try_files \$uri =404;
                }
                location / {
                    try_files \$uri \$uri/ =404;
                }
                location ~ /\. {
                    deny all;
                }
                gzip on;
                gzip_types text/css application/javascript application/json image/svg+xml;
            }
            EOF_NGINX
            nginx -t
            systemctl reload nginx || systemctl start nginx || service nginx restart
            echo "Deployed build to $ROLL_DEPLOY_PATH"

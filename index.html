<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e7"><meta name="description" content="在一个随时间运转的校园里，慢慢认识那些曾经模糊的人。那个谁 · 军训篇。">
  <title>那个谁 — 九月，我们还不认识</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="/src/styles.css"><link rel="stylesheet" href="/src/encounter.css">
</head>
<body>
  <div id="app">
    <header class="masthead">
      <a class="wordmark" href="#" data-action="home" aria-label="那个谁，返回扉页">那个谁<span class="wordmark-dot"></span></a>
      <span class="chapter-name">第一章 <i></i> 九月，我们还不认识</span>
      <nav class="top-actions" aria-label="游戏工具">
        <button data-action="schedule" aria-label="查看日程"><span data-icon="calendar"></span><span>日程</span></button>
        <button data-action="journal" aria-label="打开记忆手册"><span data-icon="book"></span><span>手册</span><i id="memory-dot" hidden></i></button>
        <button class="icon-only" data-action="sound" aria-label="开启声音"><span id="sound-icon" data-icon="sound-off"></span></button>
        <button class="icon-only" data-action="settings" aria-label="设置与暂停"><span data-icon="settings"></span></button>
      </nav>
    </header>
    <main id="game-stage" aria-label="校园探索">
      <canvas id="campus" tabindex="0" aria-label="校园地图。方向键或 WASD 移动，E 键与附近人物互动，也可点击地图行走。"></canvas>
      <div class="clock-panel"><div class="clock-date"><span id="date-label">九月一日</span><span id="day-label">入学日</span></div><div class="clock-time"><span id="time-label">15:20</span><span id="weather-icon" data-icon="sun"></span></div><div class="clock-caption"><span class="live-dot"></span><span id="clock-caption">校园的时间，正在慢慢向前</span></div></div>
      <button id="agenda-peek" class="agenda-peek" data-action="schedule"><span class="small-label">接下来</span><strong id="next-event-label">在校园里走一走</strong><span data-icon="arrow-right"></span></button>
      <div class="map-caption"><span class="map-kicker">校园一隅</span><span id="location-label">宿舍前的小路</span><span class="map-coordinate" id="map-coordinate">AUTUMN / 01</span></div>
      <div id="notification" class="notification" role="status" aria-live="polite"></div>
      <div id="navigation-hint" class="navigation-hint" hidden><span data-icon="footsteps"></span><span></span><button data-action="cancel-walk" aria-label="取消前往">×</button></div>
      <div class="map-tools"><button data-action="zoom-in" aria-label="放大地图">+</button><button data-action="zoom-out" aria-label="缩小地图">−</button><button data-action="recenter" aria-label="回到我的位置"><span data-icon="locate"></span></button></div>
      <div class="game-dock"><button data-action="places"><span data-icon="map"></span><span>去哪里</span></button><span class="dock-divider"></span><button id="interact-button" class="interact-button" data-action="interact" disabled><span data-icon="talk"></span><span>走近一点，认识一下</span><kbd>E</kbd></button><span class="dock-divider"></span><button data-action="wait"><span data-icon="clock"></span><span>等一会儿</span></button></div>
      <div class="movement-help"><span class="desktop-help">方向键 / WASD 行走 <b>·</b> 点击地面前往 <b>·</b> 拖动画面环顾</span><span class="mobile-help">点击地面行走 · 拖动画面环顾</span></div>
      <div id="dialogue-root"></div>
    </main>
    <div id="overlay-root"></div><div id="title-root"></div><div id="fatal-error" hidden role="alert"></div>
  </div>
  <noscript>「那个谁」需要浏览器开启 JavaScript 才能进入校园。</noscript>
  <script type="module" src="/src/main.mjs"></script>
</body>
</html>
